groups:
  - name: sunset-availability
    rules:
      - alert: SunsetServiceDown
        expr: up{job="sunset-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SUNSET service {{ $labels.instance }} is unavailable"
          description: "Prometheus cannot scrape {{ $labels.instance }} for at least 2 minutes. Check the container health and logs."

      - alert: SunsetMetricsMissing
        expr: absent(up{job="sunset-services"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "All SUNSET service metrics are missing"
          description: "Prometheus has no SUNSET scrape targets. Check its configuration and network."

  - name: sunset-traffic
    rules:
      - alert: SunsetHighServerErrorRate
        expr: |
          (
            sum by (instance) (rate(http_server_requests_seconds_count{job="sunset-services",status=~"5.."}[5m]))
            /
            clamp_min(sum by (instance) (rate(http_server_requests_seconds_count{job="sunset-services"}[5m])), 0.001)
          ) > 0.05
          and on (instance)
          sum by (instance) (rate(http_server_requests_seconds_count{job="sunset-services"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated HTTP 5xx rate on {{ $labels.instance }}"
          description: "More than 5% of requests failed for 10 minutes while traffic exceeded 0.1 requests per second."

  - name: sunset-host
    rules:
      - alert: SunsetHostMetricsMissing
        expr: up{job="sunset-host"} == 0 or absent(up{job="sunset-host"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SUNSET host metrics are unavailable"
          description: "Prometheus has not received node-exporter metrics for 2 minutes."

      - alert: SunsetHostDiskSpaceLow
        expr: node_filesystem_avail_bytes{job="sunset-host",mountpoint="/"} / node_filesystem_size_bytes{job="sunset-host",mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SUNSET server disk space below 15%"
          description: "Root filesystem has less than 15% free space; inspect backups, images and logs before deploying."

      - alert: SunsetHostDiskSpaceCritical
        expr: node_filesystem_avail_bytes{job="sunset-host",mountpoint="/"} / node_filesystem_size_bytes{job="sunset-host",mountpoint="/"} < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SUNSET server disk space below 5%"
          description: "Root filesystem is nearly full; stop deployments and investigate before making changes."
