spring.application.name=sunset
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:/db/changelog/changelog-master.xml
spring.liquibase.enabled=true

spring.security.jwt.secret=${SPRING_SECURITY_JWT_SECRET}
spring.security.jwt.expirationMs=86400000

logging.level.root=INFO
logging.level.com.sunset.auth.config=INFO

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.access=INFO

logging.level.com.sunset=INFO
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.tracing.enabled=false
logging.pattern.level=%5p [requestId:%X{requestId:-}]

