# Temporary HTTP-only vhost for the first admin.t3ch.pro ACME challenge.
# Remove this file from sites-enabled after the admin certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name admin.t3ch.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / { return 404; }
}
