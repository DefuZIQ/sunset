# SUNSET storefront, isolated administration, and private API reverse proxy.
map $http_origin $sunset_admin_bad_origin {
    default 1;
    "" 0;
    "https://admin.t3ch.pro" 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name t3ch.pro www.t3ch.pro api.t3ch.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.t3ch.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name t3ch.pro www.t3ch.pro;

    ssl_certificate /etc/letsencrypt/live/sunset-t3ch-pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunset-t3ch-pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /srv/sunset/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /admin {
        return 308 https://admin.t3ch.pro/;
    }

    location /admin/ {
        return 308 https://admin.t3ch.pro/;
    }

    location ~ ^/(api/v1/)?(auth/(admin|mfa|iam|staff)|products/admin|order/admin)(/|$) {
        return 404;
    }

    location /api/ {
        # A review photo may be 5 MiB; leave room for multipart framing.
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(auth|products|order|notifications|subscriptions|actuator/health)(/|$) {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assistant/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.t3ch.pro;

    ssl_certificate /etc/letsencrypt/live/sunset-admin-t3ch-pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunset-admin-t3ch-pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /srv/sunset/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        if ($sunset_admin_bad_origin) { return 403; }
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        try_files /admin/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.t3ch.pro;

    ssl_certificate /etc/letsencrypt/live/sunset-t3ch-pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunset-t3ch-pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(api/v1/)?(auth/(admin|mfa|iam|staff)|products/admin|order/admin)(/|$) {
        return 404;
    }

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
