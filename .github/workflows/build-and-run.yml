name: Build and Run Sunset Project

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build backend and frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Maven modules
        working-directory: sunset
        run: |
          ./mvnw clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: sunset/frontend
        run: npm ci

      - name: Build frontend
        working-directory: sunset/frontend
        run: npm run build

  docker-compose:
    name: Docker Compose up
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:13.15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
      pgadmin:
        image: dpage/pgadmin4
        env:
          PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
        ports:
          - 5050:80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services with Docker Compose
        working-directory: sunset
        run: |
          # Build images via docker-compose (uses Dockerfiles defined in service configs)
          docker compose build --pull
          # Start services, forcing build to ensure images are up-to-date
          docker compose up -d --build --remove-orphans
          # Allow services time to initialize
          sleep 30
          docker compose ps

      - name: Validate services
        working-directory: sunset
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused -f http://localhost:8080/products/all

      - name: Tear down services
        working-directory: sunset
        run: |
          docker compose down --remove-orphans
