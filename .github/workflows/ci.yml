name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunset
    steps:
      - uses: actions/checkout@v4
      - name: Verify core OpenAPI contract
        shell: pwsh
        run: ./scripts/verify-openapi.ps1

  observability-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunset
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus configuration and alert rules
        run: docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: Validate Grafana dashboard JSON
        run: jq -e '.uid == "sunset-overview" and (.panels | length) >= 6' ops/grafana/dashboards/sunset-overview.json
      - name: Validate observability Compose configuration
        env:
          POSTGRES_PASSWORD: ci-not-used-at-runtime
          JWT_SECRET: ci-validation-secret-at-least-32-bytes
          GRAFANA_ADMIN_PASSWORD: ci-not-used-at-runtime
        run: docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml config --quiet

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sunset/pom.xml
      - run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sunset/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sunset/frontend/package-lock.json
      - run: npm ci
      - run: npm run api:types:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sunset/frontend/playwright-report/
          retention-days: 14

  commerce-http-e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: sunset
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sunset
          POSTGRES_PASSWORD: sunset-e2e-only
          POSTGRES_DB: sunset_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunset -d sunset_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sunset/pom.xml
      - name: Build real services
        run: mvn --batch-mode -q package -DskipTests
      - name: Run isolated HTTP journey
        run: bash scripts/test-commerce-e2e.sh

  images:
    runs-on: ubuntu-latest
    needs: [api-contract, observability-config, backend, frontend, commerce-http-e2e]
    defaults:
      run:
        working-directory: sunset
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        env:
          POSTGRES_PASSWORD: ci-not-used-at-runtime
          JWT_SECRET: ci-validation-secret-at-least-32-bytes
          GRAFANA_ADMIN_PASSWORD: ci-not-used-at-runtime
        run: docker compose -f docker-compose.prod.yml build
